apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-observer
  namespace: platform
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-observer
  namespace: platform
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-observer
  namespace: platform
subjects:
  - kind: ServiceAccount
    name: platform-observer
    namespace: platform
roleRef:
  kind: Role
  name: platform-observer
  apiGroup: rbac.authorization.k8s.io
